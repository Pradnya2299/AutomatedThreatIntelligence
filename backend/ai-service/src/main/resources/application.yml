spring:
  application:
    name: ai-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/threat_advisor}
    username: ${POSTGRES_USER:threat_advisor}
    password: ${POSTGRES_PASSWORD:threat_advisor_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      auto-startup: true
      ack-mode: record
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 200ms
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${AI_SERVICE_PORT:8084}

ai:
  demo-mode: ${AI_DEMO_MODE:true}
  api-key: ${OPENAI_API_KEY:}
  project-id: ${OPENAI_PROJECT_ID:}
  chat-model: ${OPENAI_MODEL:gpt-4o-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  top-k: ${AI_RAG_TOP_K:5}
  prompt-version: v1
  cache-ttl-seconds: 3600
  ingest-on-startup: true
  chunk-size-chars: 2000
  chunk-overlap-chars: 200
  correlation-base-url: ${CORRELATION_SERVICE_URL:http://localhost:8082}
  risk-base-url: ${RISK_SERVICE_URL:http://localhost:8083}
  ingestion-base-url: ${INGESTION_SERVICE_URL:http://localhost:8081}
  nvd-lookup-enabled: ${NVD_LOOKUP_ENABLED:true}
  max-agent-iterations: ${AI_MAX_AGENT_ITERATIONS:10}
  git:
    enabled: ${GITHUB_ENABLED:false}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    organization: ${GITHUB_ORGANIZATION:}
  code-remediation:
    max-changed-files: ${AI_MAX_CHANGED_FILES:20}
    max-changed-lines: ${AI_MAX_CHANGED_LINES:400}
    max-patch-attempts: ${AI_MAX_PATCH_ATTEMPTS:3}
    skip-host-builds: ${AI_SKIP_HOST_BUILDS:true}

openai:
  api-key: ${OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: true
    kafka:
      enabled: true
    redis:
      enabled: false
  tracing:
    enabled: false

logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} service=ai-service level=%p correlationId=%X{correlationId:-} investigationId=%X{investigationId:-} eventId=%X{eventId:-} cveId=%X{cveId:-} findingId=%X{findingId:-} assetId=%X{assetId:-} riskAssessmentId=%X{riskAssessmentId:-} remediationPlanId=%X{remediationPlanId:-} agent=%X{agent:-} operation=%X{operation:-} %msg%n'
