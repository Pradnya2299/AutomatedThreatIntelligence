spring:
  application:
    name: api-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/threat_advisor}
    username: ${POSTGRES_USER:threat_advisor}
    password: ${POSTGRES_PASSWORD:threat_advisor_dev_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${API_SERVICE_PORT:8080}

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: false
  tracing:
    enabled: false

logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} service=api-service level=%p correlationId=%X{correlationId:-} eventId=%X{eventId:-} operation=%X{operation:-} %msg%n'
